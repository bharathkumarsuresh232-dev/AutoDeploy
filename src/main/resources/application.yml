spring:
  application:
    name: Sterling Auto Deploy
  profiles:
    active: dev

server:
  port: 8080
  servlet:
    context-path: /api
  error:
    include-stacktrace: on-param
    include-message: always

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      show-components: always
  metrics:
    enabled: true

logging:
  level:
    root: INFO
    com.sterling: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: /opt/sterling/logs/application.log
    max-size: 10MB
    max-history: 30

app:
  deployment:
    git:
      repository-path: /opt/sterling/repo
      timeout-seconds: 300
    maven:
      command: mvn clean package -DskipTests
      timeout-seconds: 600
    deployment:
      beta-path: /opt/sterling/beta
      prod-path: /opt/sterling/prod
      log-path: /opt/sterling/logs
    process:
      start-command: nohup java -jar
      kill-timeout-seconds: 30

jackson:
  default-property-inclusion: non_null
  serialization:
    write-dates-as-timestamps: false
    indent-output: true